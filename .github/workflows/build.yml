name: build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  ContinuousIntegrationBuild: true

permissions:
  contents: read

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        global-json-file: global.json

    # Builds of main produce {major}.{minor}.{run number} (e.g. 1.0.42) and builds of any other branch
    # produce {major}.{minor}.{run number}-{branch} (e.g. 1.0.43-feature-cosmos-ttl), where the major and
    # minor versions come from the VersionPrefix defined in Directory.Build.props. Characters that aren't
    # allowed in NuGet pre-release labels are replaced by dashes. Note: the branch name is passed using an
    # environment variable rather than being inlined in the script to prevent script injection.
    - name: Compute package version
      id: version
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        prefix=$(sed -n 's:.*<VersionPrefix>\([0-9]*\.[0-9]*\)\.[0-9]*</VersionPrefix>.*:\1:p' Directory.Build.props)
        if [[ -z "$prefix" ]]; then
          echo "::error::Unable to read the major and minor versions from Directory.Build.props."
          exit 1
        fi

        version="$prefix.$GITHUB_RUN_NUMBER"

        if [[ "$BRANCH" != "main" ]]; then
          label=$(printf '%s' "$BRANCH" | sed -e 's/[^0-9A-Za-z-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          # Note: purely numeric pre-release labels can't have leading zeros, so they're prefixed.
          if [[ -z "$label" || "$label" =~ ^[0-9]+$ ]]; then
            label="branch-$label"
          fi
          version="$version-$label"
        fi

        echo "Package version: $version"
        echo "args=-p:Version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore ${{ steps.version.outputs.args }}

    # Note: the integration tests only run when the OPENIDDICT_COSMOSDB_CONNECTION_STRING
    # repository secret is configured. Without it, they are reported as skipped.
    - name: Test
      run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults
      env:
        OPENIDDICT_COSMOSDB_CONNECTION_STRING: ${{ secrets.OPENIDDICT_COSMOSDB_CONNECTION_STRING }}

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: TestResults

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output packages ${{ steps.version.outputs.args }}

    - name: Upload packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages
        path: packages
        if-no-files-found: error

  deploy:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Download packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: packages

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 10.0.x

    # Note: GitHub Packages doesn't support symbol packages, so the PDBs and
    # sources are embedded in the assemblies (see Directory.Build.props).
    - name: Push packages
      run: >-
        dotnet nuget push "*.nupkg"
        --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        --api-key "${{ secrets.GITHUB_TOKEN }}"
        --skip-duplicate
